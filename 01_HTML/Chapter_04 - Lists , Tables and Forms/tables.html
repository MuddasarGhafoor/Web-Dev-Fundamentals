<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table HTML</title>
</head>

<body>
    <div>
        <table>
            <caption>Maximum score of different players in different games</caption>
            <thead>
                <tr>
                    <th>Serial No.</th>
                    <th>Name</th>
                    <th>Max score</th>
                    <th>Game</th>
                    <th colspan="2">Colspan</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>6813</td>
                    <td>Hamza</td>
                    <td>28</td>
                    <td>Chikoo</td>
                    <td>1</td>
                    <td>2</td>
                </tr>
                <tr>
                    <td>1234</td>
                    <td>Ali</td>
                    <td>125 </td>
                    <td>Hockey</td>
                    <td>1</td>
                    <td>2</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
