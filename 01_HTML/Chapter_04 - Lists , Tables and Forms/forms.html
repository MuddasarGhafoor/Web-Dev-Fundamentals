<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms HTML</title>
</head>

<body>
    <div>
        <h1>Treval form for a trip</h1>

        <input type="text" placeholder="Enter Your Name"><br>

        <label for="sectionida">
            <input type="radio" value="section a" name="section" id="sectionida"> Section A
        </label>
        <label for="sectionidb">
            <input type="radio" value="section b" name="section" id="sectionidb"> Section B
        </label>
        <label for="sectionidc">
            <input type="radio" value="section c" name="section" id="sectionidc"> Section C
        </label><br>
        
        <input type="checkbox" id="foodcanteen" class="blue" name="Canteen">
        <label for="foodcanteen">Want Food Canteen Card</label><br>

        <textarea name="explain" id="explain" cols="30" rows="10" placeholder="Explain why you want to choose?"></textarea><br>

        <select name="car" id="car">
            <option value="no-car">Select your car</option>
            <option value="honda">Honda</option>
            <option value="corola">Corola</option>
            <option value="fortunier">Fortunier</option>
            <option value="luxus">Luxus</option>
        </select>
    </div>
</body>

</html>
